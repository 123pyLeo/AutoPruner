name: CPU validation
on:
  push:
    branches: ['main', 'release/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m autoprune.run_e2e --backend mock --agent rule --prompt 'prune libero_object, SR>=40%' --run-root runs
